name: Build and release
permissions:
  contents: write
  actions: write

on:
  push:
    branches:
      - susaf-dev
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'
      - 'module/**'
      - 'webui/**'
      - 'update.json'
  workflow_dispatch:

env:
  MODULE_NAME: 'SusAF'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 'latest'

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
        cache: 'pnpm'
        cache-dependency-path: webui/pnpm-lock.yaml

    - name: build webroot
      run: |
        cd webui
        pnpm install --frozen-lockfile --config.verify-deps-before-run=false
        pnpm build

    - name: Test module scripts
      run: |
        ./tests/test-migration.sh
        ./tests/test-boot-state.sh
        ./tests/test-kernel-umount.sh
        ./tests/test-safer-defaults.sh
        ./tests/test-diagnostics.sh
        ./tests/test-secure-updater.sh
        ./tests/test-safe-restore.sh

    - name: Validate metadata
      run: |
        jq -e . update.json module/common/repo.json >/dev/null
        test "$(sed -n 's/^id=//p' module/module.prop)" = "susaf"
        test "$(sed -n 's/^name=//p' module/module.prop)" = "Sus'AF"
        test "$(sed -n 's/^version=//p' module/module.prop)" = "$(jq -r .version update.json)"
        test "$(sed -n 's/^versionCode=//p' module/module.prop)" = "$(jq -r .versionCode update.json)"

    - name: Refuse development release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=$(jq -r .version update.json)
        test "${GITHUB_REF_NAME}" = "${VERSION}" || {
          echo "Tag ${GITHUB_REF_NAME} does not match update.json version ${VERSION}" >&2
          exit 1
        }
        case "${VERSION}" in
          *-dev*) echo "Development versions cannot be published" >&2; exit 1 ;;
        esac

    - name: Set variables
      id: setup
      run: |
        VERSION=$(jq -r .version update.json)
        echo "VERSION=${VERSION}" >> $GITHUB_ENV
        ZIP_NAME=${{ env.MODULE_NAME }}_${VERSION#v}
        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

    - name: Package module
      run: |
        set -euo pipefail
        mkdir -p dist/package
        cp -a module/. dist/package/
        (cd dist/package && zip -qr "../${ZIP_NAME}.zip" .)
        cp "dist/${ZIP_NAME}.zip" dist/SusAF.zip
        (cd dist && sha256sum "${ZIP_NAME}.zip" SusAF.zip > SHA256SUMS)

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ZIP_NAME }}
        path: |
          dist/${{ env.ZIP_NAME }}.zip
          dist/SusAF.zip
          dist/SHA256SUMS

    - name: Generate changelog
      id: changelog
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        FROM_REF=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
        python .github/scripts/generate_changelog.py \
          --repo-slug "${GITHUB_REPOSITORY}" \
          --from "${FROM_REF}" \
          --to HEAD \
          --version "${{ env.VERSION }}" \
          --output changelog_body.md

    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/${{ env.ZIP_NAME }}.zip
          dist/SusAF.zip
          dist/SHA256SUMS
        tag_name: "${{ env.VERSION }}"
        name: "Sus'AF ${{ env.VERSION }}"
        body_path: changelog_body.md
        draft: false
        prerelease: ${{ contains(env.VERSION, '-') }}
